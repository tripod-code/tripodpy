# .github/workflows/tests.yml
# Unit tests run automatically on every push to main and on every pull request.
# The example simulations (DuffellGap, Smooth) take about half an hour and only
# run when the workflow is started manually from the Actions tab.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # manual runs from the GitHub UI
    inputs:
      run_duffle:
        description: 'Run the DuffellGap example simulation'
        required: false
        default: true
        type: boolean
      run_smooth:
        description: 'Run the Smooth example simulation'
        required: false
        default: true
        type: boolean
      run_unit_tests:
        description: 'Run unit tests'
        required: false
        default: true
        type: boolean

jobs:
  run-duffle:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_duffle }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run DuffellGap.py
        run: python ./tests/DuffellGap.py

  run-smooth:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smooth }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Smooth.py
        run: python ./tests/Smooth.py
  unit_tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_unit_tests }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Fortran compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13

      - name: Install dependencies
        run: |
          gfortran --version
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest unit_tests/ --cov=tripodpy

  conda_install:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_unit_tests }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: tripodpy
          miniforge-version: latest

      - name: Install TriPoDPy
        run: |
          gfortran --version
          pip install .
          pip install pytest

      - name: Run unit tests
        run: pytest unit_tests/